# nginx site for brandmaska.com
# Install:
#   sudo cp /srv/brandmaska/deploy/brandmaska.nginx.conf /etc/nginx/sites-available/brandmaska
#   sudo ln -s /etc/nginx/sites-available/brandmaska /etc/nginx/sites-enabled/brandmaska
#   sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS:
#   sudo certbot --nginx -d brandmaska.com -d www.brandmaska.com
#
# The port in proxy_pass must match PORT in deploy/brandmaska.service.

server {
    listen 80;
    listen [::]:80;
    server_name brandmaska.com www.brandmaska.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
